doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'AppMigrations\Schema': '%kernel.project_dir%/migrations/Schema'
    enable_profiler: false
    storage:
        table_storage:
            table_name: doctrine_schema_versions
    all_or_nothing: false
    # MariaDB DDL commits implicitly; generated schema migrations must say so.
    transactional: false
