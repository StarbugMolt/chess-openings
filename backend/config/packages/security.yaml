security:
    password_hashers:
        App\Entity\User:
            algorithm: sodium
    providers:
        accounts:
            entity: { class: App\Entity\User, property: email }
    firewalls:
        main:
            lazy: true
            provider: accounts
            user_checker: App\Security\VerifiedUserChecker
            custom_authenticators: [App\Security\AccountAuthenticator]
            entry_point: App\Security\AccountAuthenticator
            remember_me:
                secret: '%kernel.secret%'
                name: CHESS_REMEMBER
                lifetime: 2592000
                path: /
                secure: auto
                httponly: true
                samesite: lax
                remember_me_parameter: rememberMe
                signature_properties: [password]
            logout:
                path: /api/auth/logout
                enable_csrf: true
                csrf_token_id: account
                invalidate_session: true
    access_control:
        - { request_matcher: App\Security\AccountRoutes, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: sodium
                time_cost: 3
                memory_cost: 10

when@prod:
    security:
        firewalls:
            main:
                remember_me:
                    secure: true
