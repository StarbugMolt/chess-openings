name: chess-openings

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/app
      - php_runtime:/app/backend/var
      - php_vendor:/app/backend/vendor
      - composer_cache:/tmp/composer-cache
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      APP_ENV: dev
      APP_DEBUG: 1
      APP_SECRET: local-development-only
      DEFAULT_URI: http://localhost:${FRONTEND_PORT:-5173}
      DATABASE_URL: mysql://chess:local-chess-only@db:3306/chess?charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: .docker/node/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/frontend/node_modules
      - npm_cache:/tmp/npm-cache
    environment:
      API_PROXY_TARGET: http://app
      npm_config_cache: /tmp/npm-cache
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:10.11.14
    environment:
      MARIADB_DATABASE: chess
      MARIADB_USER: chess
      MARIADB_PASSWORD: local-chess-only
      MARIADB_ROOT_PASSWORD: local-root-only
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [test]
    working_dir: /app/frontend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/frontend/node_modules
    environment:
      BASE_URL: http://frontend:5173
      CI: ${CI:-}
    command: npm run test:e2e
    depends_on:
      frontend:
        condition: service_started

volumes:
  database:
  node_modules:
  php_runtime:
  php_vendor:
  composer_cache:
  npm_cache:
